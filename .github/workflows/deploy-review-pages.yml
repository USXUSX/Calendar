name: Deploy review Pages

on:
  workflow_dispatch:
    inputs:
      review_ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: main
  push:
    branches:
      - codex/issue-17-review-pages

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: review-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      review_ref: ${{ steps.target.outputs.review_ref }}
      review_sha: ${{ steps.revision.outputs.review_sha }}

    steps:
      - name: Select review ref
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.review_ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            review_ref="codex/issue-15-ui-density"
          else
            review_ref="$REQUESTED_REF"
          fi
          echo "review_ref=$review_ref" >> "$GITHUB_OUTPUT"

      - name: Check out workflow assets
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-source

      - name: Check out review ref
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.review_ref }}
          path: review-source

      - name: Record deployed revision
        id: revision
        run: echo "review_sha=$(git -C review-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assemble static review site
        run: |
          mkdir -p _site/Sources _site/Samples
          cp -R review-source/Sources/web _site/Sources/web
          cp review-source/Samples/synthetic-trip.json _site/Samples/synthetic-trip.json
          cp workflow-source/.github/review-pages-index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload review artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summarize deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVIEW_REF: ${{ needs.build.outputs.review_ref }}
          REVIEW_SHA: ${{ needs.build.outputs.review_sha }}
        run: |
          echo "### Review deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`$REVIEW_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$REVIEW_SHA\`" >> "$GITHUB_STEP_SUMMARY"
